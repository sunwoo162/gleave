name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated artifact to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build and validate artifacts
        run: |
          python -m build --no-isolation
          python scripts/check_artifacts.py dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-product-builder-${{ github.ref_name }}
          path: dist/*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: oss-product-builder-${{ github.ref_name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
