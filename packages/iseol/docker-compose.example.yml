services:
  npc:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      ISEOL_WEB_HOST: 0.0.0.0
      ISEOL_WEB_PORT: 3000
      ISEOL_WEB_TOKEN: ${ISEOL_WEB_TOKEN:-}
      ISEOL_RUNTIME_CONFIG: /app/iseol-runtime.json
    volumes:
      - npc-data:/app/data
    restart: unless-stopped

volumes:
  npc-data:
