name: Deploy over SSH

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref or tag to deploy
        required: true
        default: main
        type: string
      app_port:
        description: Loopback port used by the remote web runtime
        required: true
        default: "3000"
        type: string

permissions:
  contents: read

concurrency:
  group: production-ssh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      APP_PORT: ${{ inputs.app_port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm --prefix user-ui ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run user-ui:build
      - run: npm run smoke:production-bootstrap

      - name: Create deployment archive
        run: |
          tar -czf "iseol-${GITHUB_SHA}.tar.gz" \
            dist user-ui/dist src scripts package.json package-lock.json \
            tsconfig.json ecosystem.config.cjs .env.example iseol-runtime.example.json

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Install pinned host key
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release archive
        run: |
          archive="iseol-${GITHUB_SHA}.tar.gz"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/incoming' '${DEPLOY_PATH}/releases'"
          scp -P "${DEPLOY_PORT:-22}" "$archive" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/incoming/$archive"

      - name: Activate release and verify health
        run: |
          archive="${DEPLOY_PATH}/incoming/iseol-${GITHUB_SHA}.tar.gz"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${DEPLOY_PATH}' '${GITHUB_SHA}' '$archive' '${APP_PORT}'" \
            < scripts/ssh-remote-deploy.sh
